services:
  shelfsync-api:
    build: .
    image: shelfsync-api:latest
    container_name: shelfsync-api
    restart: unless-stopped
    environment:
      - PORT=4000
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    volumes:
      - /mnt/almacenamiento/shelfsync/uploads:/app/uploads
    networks:
      - tunnel

networks:
  tunnel:
    external: true
